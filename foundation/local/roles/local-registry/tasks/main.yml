---
- name: Setup platform facts
  ansible.builtin.set_fact:
    target_platform_os: "{{ ansible_facts['os_family'] | lower }}"
    target_platform_architecture: "{{ ansible_facts['architecture'] | lower | replace('aarch64', 'arm64') | replace('x86_64', 'amd64') }}"
- include_tasks: create-registry.yml
- include_tasks: connect-registry.yml
